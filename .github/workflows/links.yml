name: Link check

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # GitHub returns 404 for /stargazers, /forks and /watchers to anonymous
      # clients, so a badge pointing at them looks dead to the checker.
      # Google Scholar answers non-browser clients with 403: a maintainer link there
      # is live in a browser and "dead" to the checker.
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,206,429
            --exclude 'img.shields.io'
            --exclude 'localhost'
            --exclude '^https://github\.com/[^/]+/[^/]+/(stargazers|forks|watchers)(/|$)'
            --exclude '^https://scholar\.google\.com/'
            README.md README.zh-CN.md CONTRIBUTING.md docs/ lib/papers.ts
          fail: true
