name: Data and build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:data
      - run: npm run test:sources
      - run: npm run artifacts
      - name: Ensure generated artifacts are current
        run: git diff --exit-code README.md README.zh-CN.md data/papers.json
      - run: npm run build
